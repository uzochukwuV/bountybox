server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets never change; index.html must not be cached so runtime
    # env injection is picked up on deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
